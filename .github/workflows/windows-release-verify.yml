name: Windows release verification
# Downloads the packages exactly as users get them from a published GitHub release and checks
# them on clean Windows runners: SHA-256, portable ZIP launch (online smoke), silent install,
# browser registration, launch and uninstall.
on:
  push:
    branches: ['feat/windows-edition']
    paths:
      - '.github/workflows/windows-release-verify.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify
        required: true
        default: windows-v1.0.0
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      SAFEER_SMOKE_TIMEOUT: '420'
      TAG: ${{ github.event.inputs.tag || 'windows-v1.0.0' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pillow for log screenshots
        run: python -m pip install "Pillow>=10.4"
      - name: System
        run: Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List
      - name: Download published packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force build/windows/out | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir build/windows/out --pattern '*.exe' --pattern '*.zip' --pattern 'SHA256SUMS'
          Get-ChildItem build/windows/out | Format-Table Name, Length
      - name: Verify SHA-256 checksums
        run: |
          $ok = $true
          foreach ($line in Get-Content build/windows/out/SHA256SUMS) {
            if (-not $line.Trim()) { continue }
            $hash, $name = $line -split '\s+', 2
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path build/windows/out $name)).Hash.ToLower()
            if ($actual -eq $hash) { Write-Host "OK   $name" } else { Write-Host "FAIL $name $actual"; $ok = $false }
          }
          if (-not $ok) { exit 1 }
      - name: Portable ZIP - extract and launch (online smoke test)
        run: |
          $zip = (Get-ChildItem build/windows/out/*-portable.zip).FullName
          Expand-Archive -Path $zip -DestinationPath build/windows/portable -Force
          python windows/build_windows.py smoke-frozen --exe "build/windows/portable/Safeer Browser/SafeerBrowser.exe" --online --report build/windows/out/smoke-portable.json --screenshot build/windows/out/portable-start-page.png
      - name: Installer - silent install, registration, launch and uninstall
        run: python windows/build_windows.py install-test
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-verification-${{ matrix.os }}
          path: |
            build/windows/out/*.json
            build/windows/out/*.png
            build/windows/out/install.log
          if-no-files-found: ignore
