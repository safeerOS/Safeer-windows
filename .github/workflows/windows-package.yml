name: Windows package
on:
  push:
    branches: ['**']
    tags: ['windows-v*']
    paths:
      - 'windows/**'
      # Vse jedro, ne le nekaj datotek: jedro Safeer Linka (core/link_*.py) gre v paket in ima tu svoje preizkuse.
      # Do 5. 10. 2026 potisk, ki je spremenil samo core/link_mesh.py, preverjanja sploh ni sprozil.
      - 'core/**'
      - 'tests/**'
      - 'conftest.py'
      - 'ui/home.*'
      - 'ui/splet.*'
      - 'assets/icon.png'
      - 'assets/safeer-mark.svg'
      - '.github/workflows/windows-package.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'core/**'
      - 'ui/home.*'
      - 'ui/splet.*'
      - '.github/workflows/windows-package.yml'
  # No `release: published` trigger. Publishing a release used to start this workflow again: it rebuilt the
  # packages and replaced the files of the release that had just been published. Builds are not bit-for-bit
  # reproducible, so users would get files other than the ones that were tested (found in Safeer-linux, 4 Oct 2026).
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      SAFEER_SMOKE_TIMEOUT: '420'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - name: Version
        id: version
        run: |
          $version = (Get-Content windows/VERSION -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Safeer Browser for Windows $version"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows/requirements.txt
          python -c "import PySide6, PyInstaller; from PySide6.QtCore import qVersion; print('PySide6', PySide6.__version__, 'Qt', qVersion(), 'PyInstaller', PyInstaller.__version__)"
      - name: Unit tests
        # Isto kot doma (pytest + conftest.py, ki javne medijske API-je zamenja s ponaredkom):
        # unittest ne nalozi conftest.py, zato so testi klicali pravi splet in padali.
        env:
          PYTHONPATH: windows
        run: |
          python -m pip install "pytest>=8,<9"
          python -m pytest windows/tests -q
      - name: Safeer Link TLS socket shared by two threads (real Windows sockets)
        run: python -m pytest tests/test_link_vticnik.py tests/test_link_rele_tls.py -q
      - name: Safeer Link Mesh (devices across hubs, device address across the hub boundary)
        run: python -m pytest tests/test_link_mesh.py tests/test_link_mesh_naslovi.py tests/test_link_naslovi_racunalnika.py tests/test_link_oglas.py -q
      - name: No Windows Error Reporting dialogs during unattended runs
        # A crashed exe would otherwise sit in a WerFault window until the job times out.
        run: |
          New-Item -Path 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting' -Force | Out-Null
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting' -Name DontShowUI -Value 1 -Type DWord
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting' -Name Disabled -Value 1 -Type DWord
      - name: Smoke test from source (real window, online checks)
        run: python windows/build_windows.py smoke-source --online --report build/windows/out/smoke-source.json --screenshot build/windows/out/start-page.png
      - name: Fetch pinned libmpv (Safeer LGPL build, SHA-256 verified)
        run: python windows/fetch_libmpv.py
      - name: Build SafeerBrowser.exe
        run: python windows/build_windows.py pyinstaller
      - name: Smoke test built executable
        run: python windows/build_windows.py smoke-frozen --online --report build/windows/out/smoke-frozen.json
      - name: Ensure Inno Setup 6
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Portable ZIP, installer and checksums
        run: python windows/build_windows.py package
      - name: Install, launch and uninstall
        run: python windows/build_windows.py install-test
      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: safeer-browser-windows-${{ steps.version.outputs.version }}
          path: |
            build/windows/out/*.exe
            build/windows/out/*.zip
            build/windows/out/SHA256SUMS
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: safeer-browser-windows-test-reports
          path: |
            build/windows/out/*.json
            build/windows/out/*.png
            build/windows/out/*.log
          if-no-files-found: ignore
  zaganjalnik:
    # Go zaganjalnik Safeer OS (windows/launcher_go): razpakirava, stalno mesto, prave bliznjice .lnk, datoteke v rabi.
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: windows/launcher_go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: windows/launcher_go/go.mod
          cache: false
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 -v ./...
  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches windows/VERSION
        run: |
          test "windows-v$(tr -d '[:space:]' < windows/VERSION)" = "${{ github.ref_name }}"
      - uses: actions/download-artifact@v8
        with:
          name: safeer-browser-windows-${{ needs.windows.outputs.version }}
          path: release
      - name: Attach Windows packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l release
          (cd release && sha256sum -c SHA256SUMS)
          # A tag push gets a draft with the packages attached. A published release is final: its files are the
          # ones that were tested, so a re-run of this job must never replace them.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "Safeer Browser for Windows $TAG" --notes 'Windows packages. Complete the acceptance checklist before publishing.'
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "Release $TAG is already published; its packages are not replaced."
            exit 0
          fi
          gh release upload "$TAG" release/* --clobber
